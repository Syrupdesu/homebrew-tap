name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    - cron: 10 20 * * *

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1

      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HOMEBREW_NO_AUTO_UPDATE: 1
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          set +e
          casks=(kazumi piliplus voicevox "playcover-community@nightly")
          for cask in "${casks[@]}"; do
            echo "==> Checking $cask"
            livecheck_json=$(brew livecheck --cask --json "$TAP_NAME/$cask" 2>&1)
            lc_status=$?
            if [ $lc_status -ne 0 ]; then
              echo "⚠️  $cask: livecheck 执行失败 (exit $lc_status)"
              echo "$livecheck_json"
              continue
            fi

            outdated=$(echo "$livecheck_json" | jq -r '.[0].version.outdated // empty')
            if [ "$outdated" != "true" ]; then
              echo "==> $cask is up to date, skipping"
              continue
            fi

            version=$(echo "$livecheck_json" | jq -r '.[0].version.latest // empty')
            if [ -z "$version" ]; then
              echo "⚠️  $cask: 拿不到最新版本号，跳过"
              continue
            fi

            echo "==> Latest version: $version"
            brew bump-cask-pr \
              --no-audit \
              --no-fork \
              --no-browse \
              --version "$version" \
              "$TAP_NAME/$cask"
            if [ $? -ne 0 ]; then
              echo "⚠️  $cask: bump failed or already up to date, skipping"
            fi
          done
          