      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          set +e
          casks=(kazumi piliplus voicevox)
          for cask in "${casks[@]}"; do
            echo "==> Checking $cask"
            livecheck_json=$(brew livecheck --cask --json "Syrupdesu/homebrew-tap/$cask" 2>&1)
            lc_status=$?
            if [ $lc_status -ne 0 ]; then
              echo "⚠️  $cask: livecheck 执行失败 (exit $lc_status)"
              echo "$livecheck_json"
              continue
            fi

            outdated=$(echo "$livecheck_json" | jq -r '.[0].version.outdated // empty')
            if [ "$outdated" != "true" ]; then
              echo "==> $cask is up to date, skipping"
              continue
            fi

            version=$(echo "$livecheck_json" | jq -r '.[0].version.latest // empty')
            if [ -z "$version" ]; then
              echo "⚠️  $cask: 拿不到最新版本号，跳过"
              continue
            fi

            echo "==> Latest version: $version"
            brew bump-cask-pr \
              --no-browse \
              --version "$version" \
              "Syrupdesu/homebrew-tap/$cask"
            if [ $? -ne 0 ]; then
              echo "⚠️  $cask: bump failed or already up to date, skipping"
            fi
          done